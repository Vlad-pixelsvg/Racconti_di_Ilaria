<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ilaria | Archivio Secretato</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,700;1,6..72,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#F0F4F8',
              card: '#FFFFFF',
              text: '#1E293B',
              muted: '#64748B',
              accent: '#0284C7',
              accentLight: '#E0F2FE',
              redacted: '#3B82F6',
              border: '#CBD5E1'
            }
          },
          fontFamily: {
            serif: ['Newsreader', 'serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    .redacted {
      background-color: #3B82F6;
      color: transparent;
      user-select: none;
      transition: all 0.25s ease;
      cursor: pointer;
      padding: 0 4px;
      border-radius: 2px;
    }
    .redacted:hover {
      background-color: #0284C7;
      color: #FFFFFF;
    }
  </style>
</head>
<body class="bg-brand-bg text-brand-text antialiased min-h-screen flex flex-col justify-between">

  <!-- HEADER EDITORIALE -->
  <header class="border-b border-brand-border bg-white sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-6 py-5 flex justify-between items-center">
      <h1 class="font-serif text-2xl font-bold tracking-tight text-brand-text">
        ILARIA <span class="font-mono text-xs text-brand-muted font-normal tracking-normal">| ARCHIVIO SECRETATO</span>
      </h1>
      
      <!-- BOTTONE ROULETTE / CASUALE -->
      <button id="random-btn" class="font-mono text-xs bg-brand-accentLight text-brand-accent font-bold px-4 py-2 rounded-full border border-brand-accent/20 hover:bg-brand-accent hover:text-white transition-all flex items-center gap-2">
        <span>✨</span> ESTRAI STORIA CASUALE
      </button>
    </div>
  </header>

  <!-- HERO SECTION -->
  <section class="max-w-3xl mx-auto px-6 pt-12 pb-8 text-center">
    <span class="inline-block bg-brand-accentLight text-brand-accent font-mono text-[11px] px-3 py-1 rounded-full uppercase tracking-wider mb-4 font-semibold">
      Documenti riservati ad accesso libero
    </span>
    <h2 class="font-serif text-3xl md:text-4xl font-bold mb-4 leading-tight text-brand-text">
      Cronache, decisioni dubbie e dettagli desegretati.
    </h2>
    <p class="font-serif italic text-brand-muted text-base leading-relaxed">
      Passa il mouse o tocca i <span class="redacted">blocchi azzurri</span> per rivelare le informazioni censurate dall'autrice.
    </p>
  </section>

  <!-- FILTRI MOOD E STATO -->
  <section class="max-w-6xl mx-auto px-6 mb-8 w-full flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
    
    <!-- Filtro Mood -->
    <div class="flex items-center gap-2 flex-wrap">
      <span class="font-mono text-xs text-brand-muted uppercase tracking-wider">Mood:</span>
      <div id="mood-filters" class="flex flex-wrap gap-2 font-mono text-xs">
        <button data-mood="ALL" class="mood-btn px-3 py-1.5 rounded-full bg-brand-text text-white font-medium transition-all">Tutti</button>
        <button data-mood="Nostalgico" class="mood-btn px-3 py-1.5 rounded-full bg-white text-brand-muted border border-brand-border hover:border-brand-accent transition-all">Nostalgico</button>
        <button data-mood="Impulsivo" class="mood-btn px-3 py-1.5 rounded-full bg-white text-brand-muted border border-brand-border hover:border-brand-accent transition-all">Impulsivo</button>
        <button data-mood="Vergognoso" class="mood-btn px-3 py-1.5 rounded-full bg-white text-brand-muted border border-brand-border hover:border-brand-accent transition-all">Vergognoso</button>
        <button data-mood="Cinico" class="mood-btn px-3 py-1.5 rounded-full bg-white text-brand-muted border border-brand-border hover:border-brand-accent transition-all">Cinico</button>
      </div>
    </div>

    <!-- Filtro Requisiti / Stato -->
    <div class="flex items-center gap-2 flex-wrap">
      <span class="font-mono text-xs text-brand-muted uppercase tracking-wider">Requisito:</span>
      <div id="status-filters" class="flex flex-wrap gap-2 font-mono text-xs">
        <button data-status="ALL" class="status-btn px-3 py-1.5 rounded-md bg-brand-text text-white font-medium transition-all">Tutti</button>
        <button data-status="unlocked" class="status-btn px-3 py-1.5 rounded-md bg-emerald-50 text-emerald-800 border border-emerald-200 hover:bg-emerald-100 transition-all">✓ Lettura Libera</button>
        <button data-status="locked_wine" class="status-btn px-3 py-1.5 rounded-md bg-amber-50 text-amber-800 border border-amber-200 hover:bg-amber-100 transition-all">🍷 Vincolo Vino</button>
        <button data-status="locked_inexperience" class="status-btn px-3 py-1.5 rounded-md bg-slate-100 text-slate-700 border border-slate-300 hover:bg-slate-200 transition-all">🔒 Inesperienza</button>
      </div>
    </div>

  </section>

  <!-- GRIGLIA CARDS -->
  <main class="max-w-6xl mx-auto px-6 pb-20 w-full flex-grow">
    <div id="grid-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
  </main>

  <!-- MODALE DETTAGLIO STORIA -->
  <div id="story-modal" class="fixed inset-0 bg-brand-text/40 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-white border border-brand-border rounded-xl max-w-lg w-full p-8 relative shadow-xl">
      <button id="modal-close" class="absolute top-4 right-4 font-mono text-xs text-brand-muted hover:text-brand-text">
        [ ESC ]
      </button>
      <div id="modal-content"></div>
    </div>
  </div>

  <footer class="border-t border-brand-border bg-white py-6 text-center font-mono text-xs text-brand-muted">
    © 2026 ILARIA NARRATIVE ARCHIVE — Documenti ad uso personale
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
